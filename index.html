<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RutinFlow</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background-color: #090d16; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .nav-tab.active { color: #6366f1; }
    .nav-tab.active i { transform: translateY(-2px); }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="h-full flex flex-col justify-between select-none">

  <!-- Üst Mobil Bar -->
  <header class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b border-gray-800">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
        <i class="fa-solid fa-bolt-lightning text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">RutinFlow</h1>
        <div class="flex items-center gap-1.5 text-[10px] text-gray-400">
          <span id="header-streak">0 Gün Seri</span>
          <span>•</span>
          <span id="header-freeze" class="text-sky-400">2 Kalkan</span>
        </div>
      </div>
    </div>

    <button onclick="window.openModal('dataModal')" class="w-8 h-8 rounded-xl bg-gray-800 border border-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition active:scale-95">
      <i class="fa-solid fa-sliders text-xs"></i>
    </button>
  </header>

  <!-- Ana İçerik Alanı (Sekmelere Göre Değişir) -->
  <main class="flex-1 overflow-y-auto px-4 py-4 pb-24 max-w-md mx-auto w-full">

    <!-- SEKME 1: BUGÜNKÜ HEDEFLER -->
    <div id="tab-habits" class="space-y-4">
      <!-- Günlük Mini Özet Kartı -->
      <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
        <div>
          <span class="text-[11px] font-medium text-gray-400 uppercase tracking-wider">Bugünkü İlerleme</span>
          <div class="flex items-baseline gap-2 mt-0.5">
            <span id="todayRatio" class="text-2xl font-black text-white">0 / 0</span>
            <span id="todayPct" class="text-xs font-bold text-indigo-400">%0</span>
          </div>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-indigo-950/60 border border-indigo-500/30 flex items-center justify-center">
          <i class="fa-solid fa-fire text-amber-400 text-xl"></i>
        </div>
      </div>

      <!-- Alışkanlıklar Listesi -->
      <div id="habitsContainer" class="space-y-3"></div>
    </div>

    <!-- SEKME 2: ODAK SAYACI (POMODORO) -->
    <div id="tab-timer" class="hidden space-y-6 pt-4">
      <div class="glass-card rounded-3xl p-6 text-center border-indigo-500/20">
        <span class="px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-semibold">Odak Seansı</span>
        <div class="text-6xl font-mono font-black text-white my-8 tracking-wider" id="timerDisplay">25:00</div>
        
        <div class="grid grid-cols-2 gap-3">
          <button id="timerToggleBtn" onclick="window.toggleTimer()" class="py-3.5 rounded-2xl bg-indigo-600 active:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition active:scale-95">
            Başlat
          </button>
          <button onclick="window.resetTimer()" class="py-3.5 rounded-2xl bg-gray-800 border border-gray-700 text-gray-300 font-semibold text-sm active:bg-gray-700 transition active:scale-95">
            Sıfırla
          </button>
        </div>
      </div>
      <p class="text-center text-xs text-gray-500">25 dakika odaklan, 5 dakika mola ver.</p>
    </div>

    <!-- SEKME 3: ANALİZ & GRAFİKLER -->
    <div id="tab-stats" class="hidden space-y-4">
      <!-- 90 Günlük Isı Haritası -->
      <div class="glass-card rounded-2xl p-4">
        <h3 class="text-xs font-bold text-white mb-3 flex items-center justify-between">
          <span>90 Günlük Tutarlılık</span>
          <span class="text-[10px] text-gray-500">Son 3 Ay</span>
        </h3>
        <div class="overflow-x-auto pb-2">
          <div id="heatmapGrid" class="flex gap-1"></div>
        </div>
      </div>

      <!-- Haftalık Çizgi Grafik -->
      <div class="glass-card rounded-2xl p-4">
        <h3 class="text-xs font-bold text-white mb-2">Haftalık Tamamlama %</h3>
        <div class="h-44 relative">
          <canvas id="weeklyChart"></canvas>
        </div>
      </div>

      <!-- Kök Neden Analizi -->
      <div class="glass-card rounded-2xl p-4">
        <h3 class="text-xs font-bold text-white mb-2">Aksama Nedenleri</h3>
        <div class="h-40 relative">
          <canvas id="frictionChart"></canvas>
        </div>
      </div>
    </div>

  </main>

  <!-- Sabit Mobil Alt Bar (Bottom Navigation) -->
  <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-gray-800/90 px-6 py-2.5 flex items-center justify-around z-40 max-w-md mx-auto">
    <button onclick="window.switchTab('habits')" id="nav-btn-habits" class="nav-tab active flex flex-col items-center gap-1 text-gray-500 transition">
      <i class="fa-solid fa-list-check text-base"></i>
      <span class="text-[10px] font-semibold">Hedefler</span>
    </button>

    <button onclick="window.openAddModal()" class="w-12 h-12 -mt-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg shadow-indigo-600/40 border-2 border-[#090d16] active:scale-95 transition">
      <i class="fa-solid fa-plus text-base font-bold"></i>
    </button>

    <button onclick="window.switchTab('timer')" id="nav-btn-timer" class="nav-tab flex flex-col items-center gap-1 text-gray-500 transition">
      <i class="fa-solid fa-stopwatch text-base"></i>
      <span class="text-[10px] font-semibold">Odak</span>
    </button>

    <button onclick="window.switchTab('stats')" id="nav-btn-stats" class="nav-tab flex flex-col items-center gap-1 text-gray-500 transition">
      <i class="fa-solid fa-chart-pie text-base"></i>
      <span class="text-[10px] font-semibold">Analiz</span>
    </button>
  </nav>

  <!-- MODAL: Yeni Hedef / Düzenle -->
  <div id="habitModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center">
    <div class="glass-card bg-gray-900 border-t sm:border border-gray-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5">
      <div class="flex items-center justify-between pb-3 border-b border-gray-800 mb-4">
        <h3 id="modalTitle" class="text-sm font-bold text-white">Yeni Hedef Ekle</h3>
        <button onclick="window.closeModal('habitModal')" class="w-8 h-8 rounded-full bg-gray-800 text-gray-400 flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <form onsubmit="window.saveHabit(event)" class="space-y-3.5">
        <input type="hidden" id="editHabitId">
        
        <div>
          <label class="block text-[11px] font-medium text-gray-400 mb-1">Hedef Başlığı</label>
          <input type="text" id="habitTitle" required placeholder="Örn: 25 Paragraf Sorusu, 2L Su..." class="w-full bg-gray-800/90 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-[11px] font-medium text-gray-400 mb-1">Tip</label>
            <select id="habitType" onchange="window.toggleTypeFields()" class="w-full bg-gray-800/90 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
              <option value="boolean">Klasik (Tik Atma)</option>
              <option value="numeric">Sayısal Sayaç</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-gray-400 mb-1">Kategori</label>
            <select id="habitCategory" class="w-full bg-gray-800/90 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white">
              <option value="study">Çalışma / Odak</option>
              <option value="health">Beden & Sağlık</option>
              <option value="mind">Zihin & Kapanış</option>
            </select>
          </div>
        </div>

        <div id="numericFields" class="hidden grid-cols-2 gap-2.5 p-3 bg-gray-800/40 rounded-xl border border-gray-700/60">
          <div>
            <label class="block text-[10px] text-gray-400 mb-1">Hedef Değer</label>
            <input type="number" id="targetValue" min="1" value="25" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-1">Birim</label>
            <input type="text" id="targetUnit" placeholder="Soru, Sayfa..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shadow-lg shadow-indigo-600/30 transition">
            Kaydet
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Veri Yönetimi -->
  <div id="dataModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-card bg-gray-900 border-gray-700 w-full max-w-xs rounded-2xl p-5 space-y-3">
      <div class="flex items-center justify-between pb-2 border-b border-gray-800">
        <h3 class="text-xs font-bold text-white">Veri Yönetimi</h3>
        <button onclick="window.closeModal('dataModal')" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <button onclick="window.exportData()" class="w-full py-2.5 rounded-xl bg-gray-800 text-xs font-medium text-gray-200 border border-gray-700 flex items-center justify-center gap-2">
        <i class="fa-solid fa-download text-indigo-400"></i> Yedeği İndir (JSON)
      </button>
      <label class="w-full py-2.5 rounded-xl bg-gray-800 text-xs font-medium text-gray-200 border border-gray-700 flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-upload text-emerald-400"></i> Yedeği Yükle
        <input type="file" accept=".json" onchange="window.importData(event)" class="hidden">
      </label>
      <button onclick="window.resetAllData()" class="w-full py-2.5 rounded-xl bg-rose-950/40 text-xs text-rose-400 border border-rose-800/40 flex items-center justify-center gap-2">
        <i class="fa-solid fa-trash-can"></i> Tümünü Sıfırla
      </button>
    </div>
  </div>

  <!-- UYGULAMA MANTIĞI (JS) -->
  <script>
    const STORAGE_KEY = "rutinflow_mobile_v1";
    let state = { habits: [], freezesLeft: 2, frictionReasons: { "Yorgunluk": 2, "Zaman": 1, "Erteleme": 1, "Dış Etken": 0 } };

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.habits = Array.isArray(parsed.habits) ? parsed.habits : [];
          state.freezesLeft = typeof parsed.freezesLeft === 'number' ? parsed.freezesLeft : 2;
        }
      } catch (e) { console.error(e); }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.error(e); }
      renderHabits();
      renderStats();
    }

    // Sekme Değiştirme
    window.switchTab = function(tabName) {
      ['habits', 'timer', 'stats'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`nav-btn-${t}`).classList.remove('active');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-btn-${tabName}`).classList.add('active');

      if (tabName === 'stats') {
        renderHeatmap();
        renderChartsSafe();
      }
    };

    window.openModal = function(id) {
      const el = document.getElementById(id);
      if (el) { el.classList.remove('hidden'); el.classList.add('flex'); }
    };

    window.closeModal = function(id) {
      const el = document.getElementById(id);
      if (el) { el.classList.add('hidden'); el.classList.remove('flex'); }
    };

    window.openAddModal = function() {
      document.getElementById('editHabitId').value = '';
      document.getElementById('habitTitle').value = '';
      document.getElementById('habitType').value = 'boolean';
      window.toggleTypeFields();
      window.openModal('habitModal');
    };

    window.toggleTypeFields = function() {
      const type = document.getElementById('habitType').value;
      const f = document.getElementById('numericFields');
      if (type === 'numeric') { f.classList.remove('hidden'); f.classList.add('grid'); }
      else { f.classList.add('hidden'); f.classList.remove('grid'); }
    };

    window.saveHabit = function(e) {
      e.preventDefault();
      const title = document.getElementById('habitTitle').value.trim();
      const type = document.getElementById('habitType').value;
      const category = document.getElementById('habitCategory').value;
      const targetVal = parseFloat(document.getElementById('targetValue').value) || 20;
      const targetUnit = document.getElementById('targetUnit').value.trim() || 'Adet';
      if (!title) return;

      state.habits.push({
        id: 'h_' + Date.now(),
        title, type, category,
        targetValue: targetVal,
        targetUnit: targetUnit,
        logs: {}
      });

      window.closeModal('habitModal');
      saveState();
    };

    window.deleteHabit = function(id) {
      state.habits = state.habits.filter(h => h.id !== id);
      saveState();
    };

    window.toggleDay = function(habitId, dateStr) {
      const habit = state.habits.find(h => h.id === habitId);
      if (!habit) return;
      if (!habit.logs) habit.logs = {};
      const cur = habit.logs[dateStr];

      if (habit.type === 'boolean') {
        habit.logs[dateStr] = cur ? null : { completed: true, val: 1 };
      } else {
        const curVal = cur ? cur.val : 0;
        const nextVal = curVal >= habit.targetValue ? 0 : curVal + (habit.targetValue / 4);
        habit.logs[dateStr] = nextVal > 0 ? { completed: nextVal >= habit.targetValue, val: nextVal } : null;
      }
      saveState();
    };

    // UI Render
    function renderHabits() {
      const container = document.getElementById('habitsContainer');
      if (state.habits.length === 0) {
        container.innerHTML = `
          <div class="glass-card rounded-2xl p-6 text-center border-dashed border-gray-800">
            <i class="fa-solid fa-list-check text-2xl text-gray-600 mb-2"></i>
            <h4 class="text-xs font-bold text-white">Henüz hedef eklenmedi</h4>
            <p class="text-[11px] text-gray-500 mt-1 mb-3">En fazla 2-3 hedefle başla.</p>
            <button onclick="window.openAddModal()" class="px-4 py-2 rounded-xl bg-indigo-600 text-xs font-semibold text-white">
              + İlk Hedefini Ekle
            </button>
          </div>
        `;
        return;
      }

      const today = getTodayStr();
      const last7Days = [];
      const dayLabels = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        last7Days.push({
          dateStr: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
          label: dayLabels[d.getDay()]
        });
      }

      container.innerHTML = state.habits.map(h => {
        const todayLog = (h.logs && h.logs[today]) || null;
        const isDone = todayLog && todayLog.completed;

        const dayButtons = last7Days.map(item => {
          const log = (h.logs && h.logs[item.dateStr]) || null;
          const done = log && log.completed;
          const isToday = item.dateStr === today;
          return `
            <button onclick="window.toggleDay('${h.id}', '${item.dateStr}')" class="flex-1 py-1.5 rounded-lg flex flex-col items-center justify-center transition border ${
              done 
                ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400 font-bold' 
                : 'bg-gray-800/60 border-gray-800 text-gray-500'
            } ${isToday ? 'ring-1 ring-indigo-500/60' : ''}">
              <span class="text-[9px] mb-0.5">${item.label}</span>
              <i class="fa-solid ${done ? 'fa-check text-[10px]' : 'fa-minus text-[8px] opacity-40'}"></i>
            </button>
          `;
        }).join('');

        return `
          <div class="glass-card rounded-2xl p-3.5 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <button onclick="window.toggleDay('${h.id}', '${today}')" class="w-9 h-9 rounded-xl flex items-center justify-center transition active:scale-90 border ${
                  isDone 
                    ? 'bg-emerald-500 border-emerald-400 text-gray-950 font-bold' 
                    : 'bg-gray-800 border-gray-700 text-gray-400'
                }">
                  <i class="fa-solid ${isDone ? 'fa-check text-sm' : 'fa-circle text-[9px]'}"></i>
                </button>
                <div>
                  <h4 class="text-xs font-bold text-white ${isDone ? 'line-through text-gray-500' : ''}">${h.title}</h4>
                  <span class="text-[10px] text-gray-400 uppercase tracking-wider">${h.category}</span>
                </div>
              </div>
              <button onclick="window.deleteHabit('${h.id}')" class="text-gray-600 hover:text-rose-400 p-2">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>

            <!-- 7 Günlük Mini Mobil Şerit -->
            <div class="flex gap-1 pt-1 border-t border-gray-800/50">
              ${dayButtons}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderStats() {
      const today = getTodayStr();
      const total = state.habits.length;
      let doneCount = 0;
      state.habits.forEach(h => {
        if (h.logs && h.logs[today] && h.logs[today].completed) doneCount++;
      });
      const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
      document.getElementById('todayRatio').textContent = `${doneCount} / ${total}`;
      document.getElementById('todayPct').textContent = `%${pct}`;
      document.getElementById('header-freeze').textContent = `${state.freezesLeft} Kalkan`;
    }

    function renderHeatmap() {
      const grid = document.getElementById('heatmapGrid');
      if (!grid) return;
      grid.innerHTML = '';
      const total = state.habits.length;

      for (let i = 59; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        let done = 0;
        state.habits.forEach(h => { if (h.logs && h.logs[dStr] && h.logs[dStr].completed) done++; });
        const rate = total === 0 ? 0 : done / total;

        let bg = 'bg-gray-800/80';
        if (rate > 0.6) bg = 'bg-emerald-400';
        else if (rate > 0) bg = 'bg-emerald-800';

        const dot = document.createElement('div');
        dot.className = `w-3 h-3 rounded-sm ${bg} flex-shrink-0`;
        grid.appendChild(dot);
      }
    }

    let chart1 = null, chart2 = null;
    function renderChartsSafe() {
      if (typeof Chart === 'undefined') return;
      try {
        const ctx1 = document.getElementById('weeklyChart');
        if (ctx1) {
          if (chart1) chart1.destroy();
          chart1 = new Chart(ctx1, {
            type: 'line',
            data: {
              labels: ['Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct', 'Pz'],
              datasets: [{ data: [20, 40, 60, 50, 80, 90, 75], borderColor: '#6366f1', borderWidth: 2, fill: false, tension: 0.3 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { font: { size: 9 }, color: '#6b7280' } } } }
          });
        }
        const ctx2 = document.getElementById('frictionChart');
        if (ctx2) {
          if (chart2) chart2.destroy();
          chart2 = new Chart(ctx2, {
            type: 'doughnut',
            data: {
              labels: ['Yorgunluk', 'Zaman', 'Erteleme'],
              datasets: [{ data: [50, 30, 20], backgroundColor: ['#f43f5e', '#f59e0b', '#8b5cf6'], borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 9 }, color: '#9ca3af', boxWidth: 8 } } } }
          });
        }
      } catch (e) {}
    }

    // Pomodoro
    let timerInt = null, tSec = 25 * 60, tRun = false;
    window.toggleTimer = function() {
      const btn = document.getElementById('timerToggleBtn');
      if (tRun) {
        clearInterval(timerInt); tRun = false; btn.textContent = 'Devam Et';
      } else {
        tRun = true; btn.textContent = 'Durdur';
        timerInt = setInterval(() => {
          tSec--;
          if (tSec <= 0) { clearInterval(timerInt); tRun = false; tSec = 25 * 60; alert('Seans bitti!'); }
          const m = String(Math.floor(tSec / 60)).padStart(2, '0');
          const s = String(tSec % 60).padStart(2, '0');
          document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        }, 1000);
      }
    };
    window.resetTimer = function() {
      clearInterval(timerInt); tRun = false; tSec = 25 * 60;
      document.getElementById('timerDisplay').textContent = '25:00';
      document.getElementById('timerToggleBtn').textContent = 'Başlat';
    };

    window.exportData = function() {
      const blob = new Blob([JSON.stringify(state)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `rutinflow_backup.json`; a.click();
    };
    window.importData = function(e) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        try { state = JSON.parse(evt.target.result); saveState(); window.closeModal('dataModal'); } catch (err) {}
      };
      if (e.target.files[0]) reader.readAsText(e.target.files[0]);
    };
    window.resetAllData = function() {
      if (confirm('Tüm kayıtlar silinsin mi?')) {
        localStorage.removeItem(STORAGE_KEY);
        state = { habits: [], freezesLeft: 2 };
        saveState();
        window.closeModal('dataModal');
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderHabits();
      renderStats();
    });
  </script>
</body>
</html>
